<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Livechat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #fff;
            overflow: hidden;
        }

        #app{
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: #007acc solid 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #media-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #current-media {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #text-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 25px;
            max-width: 80%;
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .author {
            color: #007acc;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #placeholder {
            text-align: center;
            opacity: 0.5;
        }

        #placeholder h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>Discord Livechat</h1>
            <div id="status">
                <div class="status-dot"></div>
                <span id="status-text">Connected</span>
            </div>
        </div>
        <div id="media-container">
            <div id="placeholder">
                <h2>Waiting for media...</h2>
                <p>Send images or videos in the Discord channel</p>
            </div>
            <img id="current-media" style="display: none;" alt="Current media">
            <div id="text-overlay" style="display: none;"></div>
        </div>
    </div>
    <script src="../../dist/renderer/renderer.js"></script>
</body>
</html>
