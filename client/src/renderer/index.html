<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Livechat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fff;
            overflow: hidden;
            -webkit-app-region: no-drag;
        }

        #app{
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #media-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            pointer-events: none;
        }

        #current-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            pointer-events: auto;
        }

        #text-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 3em;
            color: white;
            text-align: center;
            max-width: 90%;
            word-wrap: break-word;
            text-transform: uppercase;
            -webkit-text-stroke: 3px black;
            text-stroke: 3px black;
            paint-order: stroke fill;
            pointer-events: none;
        }

        #placeholder {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="media-container">
            <div id="text-overlay"></div>
        </div>
        <div id="placeholder"></div>
        <span id="status-text" style="display: none;"></span>
    </div>
    <script src="../../config.js"></script>
    <script type="module" src="../../dist/renderer/renderer.js"></script>
</body>
</html>
