<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Position Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2b2d31;
            color: #dbdee1;
            padding: 24px;
        }

        h2 {
            margin: 0 0 20px 0;
            color: #fff;
            font-size: 18px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 12px;
            font-weight: 600;
            color: #b5bac1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field input {
            width: 100%;
            padding: 8px 10px;
            background: #1e1f22;
            color: #dbdee1;
            border: 1px solid #3f4147;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .field input:focus {
            outline: none;
            border-color: #5865f2;
        }

        .field span {
            font-size: 11px;
            color: #6d6f78;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s;
        }

        .btn-primary {
            background: #5865f2;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4752c4;
        }

        .btn-edit {
            background: #248046;
            color: #fff;
        }
        .btn-edit:hover {
            background: #1a6334;
        }

        .btn-reset {
            background: #4e5058;
            color: #dbdee1;
        }
        .btn-reset:hover {
            background: #6d6f78;
        }

        .status {
            margin-top: 16px;
            font-size: 12px;
            color: #23a559;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <h2>Media Region Settings</h2>

    <div class="field-grid">
        <div class="field">
            <label>X Position</label>
            <input type="number" id="input-x" step="1" />
            <span>px from left</span>
        </div>
        <div class="field">
            <label>Y Position</label>
            <input type="number" id="input-y" step="1" />
            <span>px from top</span>
        </div>
        <div class="field">
            <label>Width</label>
            <input type="number" id="input-w" min="50" step="1" />
            <span>px (min 50)</span>
        </div>
        <div class="field">
            <label>Height</label>
            <input type="number" id="input-h" min="50" step="1" />
            <span>px (min 50)</span>
        </div>
    </div>

    <div class="buttons">
        <button class="btn-primary" id="btn-apply">Apply</button>
        <button class="btn-edit" id="btn-edit">Edit Mode</button>
        <button class="btn-reset" id="btn-reset">Reset to Default</button>
    </div>

    <div class="status" id="status"></div>

    <script src="../../dist/renderer/settings-window.js" type="module"></script>
</body>
</html>
